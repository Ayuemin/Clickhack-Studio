name: Build Dzen Text v1.3.2

on:
  push:
    branches:
      - dzen-text-v1.3-build
    paths:
      - 'dzen-build/**'
      - '.github/workflows/dzen-text-v13-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore project
        shell: bash
        run: |
          mkdir -p dzen-src
          cat dzen-build/src.b64.part* | base64 -d | tar -xzf - -C dzen-src
          test -f dzen-src/Dzen-Text-source-v1.3/settings.gradle

      - name: Prepare built-in synonym dictionary and v1.3.1 base
        shell: bash
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/egorkaru/synonym_dictionary/master/dictionary.json -o /tmp/abramov.json
          python3 dzen-build/patch-v131.py dzen-src/Dzen-Text-source-v1.3 /tmp/abramov.json
          grep -q "versionName '1.3.1'" dzen-src/Dzen-Text-source-v1.3/app/build.gradle
          test -s dzen-src/Dzen-Text-source-v1.3/app/src/main/assets/synonyms_compact.json

      - name: Apply v1.3.2 dictionary fixes
        shell: bash
        working-directory: dzen-src/Dzen-Text-source-v1.3
        run: |
          patch -p1 < "$GITHUB_WORKSPACE/dzen-build/v132.patch"
          grep -q "versionName '1.3.2'" app/build.gradle
          grep -q "parseCompactStreaming" app/src/main/java/ru/dzenprep/texteditor/MainActivity.java
          grep -q "'хочу':'хотеть'" app/src/main/assets/www/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: dzen-src/Dzen-Text-source-v1.3
        run: gradle --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Dzen-Text-v1.3.2-unsigned
          path: dzen-src/Dzen-Text-source-v1.3/app/build/outputs/apk/release/app-release-unsigned.apk
